services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: querypunk-backend
    expose:
      - "8000"
    env_file:
      - ./backend/.env.prod
    volumes:
      - ./data:/data
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: /api
    container_name: querypunk-frontend
    expose:
      - "80"
    depends_on:
      - backend
    restart: unless-stopped