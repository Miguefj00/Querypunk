version: "3.9"

services:
  backend:
    build:
      context: ./backend
    container_name: querypunk-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./backend:/data
    env_file:
      - ./backend/.env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: querypunk-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - backend
    command: npm run dev -- --host
    restart: unless-stopped